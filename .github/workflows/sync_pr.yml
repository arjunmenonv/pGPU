name: Sync Public PRs → Private Repo

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    if: >-
      ${{
        github.repository == 'arjunmenonv/pGPU' &&
        (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true))
      }}
    runs-on: ubuntu-latest
    env:
      PRIVATE_REPO: github.com/arjunmenonv/pGPU-private.git
      PRIVATE_PAT: ${{ secrets.PRIVATE_PAT }}

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add private remote and force-push
        run: |
          git remote add private https://${PRIVATE_PAT}@${PRIVATE_REPO}
          git push private +refs/heads/main:refs/heads/main
